name: Compatibility and quality checks

on:
  push:
    branches: [main, "qa/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node-version }} / tests and build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify lockfile is present
        run: test -f package-lock.json
      - name: Install dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Install from lockfile
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Type-check and production build
        run: npm run build
